<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Project Tracker Pro</title>
  <style>
    :root {
      --bg: #0b0d12; --card: #12151c; --border: #2a2d36;
      --text: #e2e4ea; --muted: #8b92a5; --primary: #6366f1;
      --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
      --radius: 10px; --shadow: 0 4px 12px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }
    .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }
    
    /* Header */
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
    .controls { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
    input, select, button {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 0.5rem 0.75rem; border-radius: var(--radius); font-size: 0.9rem;
    }
    button { cursor: pointer; background: var(--primary); border: none; color: white; font-weight: 500; transition: 0.2s; }
    button:hover { opacity: 0.85; transform: translateY(-1px); }
    button.secondary { background: var(--border); color: var(--text); }
    button.danger { background: var(--danger); }
    
    /* Progress */
    .progress-wrap { background: var(--card); padding: 1rem; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 1.5rem; }
    .progress-bar-bg { height: 10px; background: var(--border); border-radius: 99px; overflow: hidden; margin-top: 0.5rem; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--success)); width: 0%; transition: width 0.4s ease; }
    .progress-stats { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); }
    
    /* Views */
    .view-toggle { display: flex; background: var(--card); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
    .view-toggle button { border: none; border-radius: 0; padding: 0.5rem 1rem; background: transparent; color: var(--muted); }
    .view-toggle button.active { background: var(--primary); color: white; }
    
    /* List View */
    .list-view { display: flex; flex-direction: column; gap: 0.6rem; }
    .task-card {
      background: var(--card); border: 1px solid var(--border); padding: 0.9rem;
      border-radius: var(--radius); display: flex; justify-content: space-between; align-items: center;
      transition: 0.2s; position: relative;
    }
    .task-card:hover { border-color: var(--primary); transform: translateY(-1px); }
    .task-meta { display: flex; flex-direction: column; gap: 0.3rem; }
    .task-title { font-weight: 500; font-size: 1rem; }
    .task-badges { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .badge {
      padding: 0.2rem 0.6rem; border-radius: 99px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
    }
    .badge.todo { background: #1e222d; color: #9ca3af; }
    .badge.progress { background: #2a2112; color: #fbbf24; }
    .badge.done { background: #0f2b1f; color: #34d399; }
    .badge.due { background: #2d1212; color: #f87171; }
    .task-actions { display: flex; gap: 0.5rem; }
    .task-actions button { padding: 0.4rem 0.6rem; font-size: 0.8rem; width: auto; }
    
    /* Kanban View */
    .kanban { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
    .kanban-col { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); min-height: 400px; display: flex; flex-direction: column; }
    .kanban-header { padding: 0.8rem 1rem; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; justify-content: space-between; }
    .kanban-body { padding: 0.5rem; flex: 1; overflow-y: auto; }
    .kanban-body.drag-over { background: rgba(99, 102, 241, 0.1); border-radius: var(--radius); }
    .kanban-card {
      background: var(--bg); border: 1px solid var(--border); padding: 0.8rem;
      border-radius: 8px; margin-bottom: 0.5rem; cursor: grab; transition: 0.2s;
    }
    .kanban-card:active { cursor: grabbing; transform: scale(1.02); }
    .kanban-card h4 { font-size: 0.95rem; margin-bottom: 0.4rem; }
    .kanban-card .sub { font-size: 0.75rem; color: var(--muted); display: flex; gap: 0.5rem; align-items: center; }
    
    /* Modals */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7);
      display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal { background: var(--card); padding: 1.5rem; border-radius: var(--radius); width: 90%; max-width: 500px; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .modal h2 { margin-bottom: 1rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-bottom: 1rem; }
    .form-grid .full { grid-column: 1 / -1; }
    .error { color: var(--danger); font-size: 0.8rem; margin-top: 0.3rem; display: none; }
    .hidden { display: none !important; }
    .loading { text-align: center; padding: 2rem; color: var(--muted); }
    .empty { text-align: center; padding: 2rem; color: var(--muted); font-style: italic; }
    
    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      header { flex-direction: column; align-items: stretch; }
      .kanban { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🚀 GitHub Tracker Pro</h1>
      <div class="controls">
        <button id="addBtn" onclick="openModal('add')">+ Tambah Tugas</button>
        <button class="secondary" onclick="exportCSV()">📥 Export CSV</button>
        <div class="view-toggle">
          <button id="viewList" class="active" onclick="switchView('list')">📋 List</button>
          <button id="viewBoard" onclick="switchView('board')">📊 Board</button>
        </div>
      </div>
    </header>

    <div class="progress-wrap">
      <div class="progress-stats">
        <span id="progLabel">Memuat progres...</span>
        <span id="progPercent">0%</span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar" id="progBar"></div></div>
    </div>

    <div class="controls" style="margin-bottom: 1rem; background: var(--card); padding: 0.8rem; border-radius: var(--radius); border: 1px solid var(--border);">
      <input type="text" id="searchInput" placeholder="🔍 Cari tugas..." style="flex:1; min-width: 200px;">
      <select id="filterStatus">
        <option value="all">Semua Status</option>
        <option value="todo">To Do</option>
        <option value="progress">In Progress</option>
        <option value="done">Done</option>
      </select>
      <input type="text" id="filterAssignee" placeholder="👤 Assignee" style="width: 150px;">
      <button class="secondary" onclick="applyFilters()">🔄 Filter</button>
    </div>

    <div id="listView" class="list-view"></div>
    <div id="boardView" class="kanban hidden">
      <div class="kanban-col" ondrop="dropHandler(event, 'todo')" ondragover="dragOver(event)" ondragleave="dragLeave(event)">
        <div class="kanban-header">📥 To Do <span id="countTodo">0</span></div>
        <div class="kanban-body" id="colTodo"></div>
      </div>
      <div class="kanban-col" ondrop="dropHandler(event, 'progress')" ondragover="dragOver(event)" ondragleave="dragLeave(event)">
        <div class="kanban-header">⚡ In Progress <span id="countProgress">0</span></div>
        <div class="kanban-body" id="colProgress"></div>
      </div>
      <div class="kanban-col" ondrop="dropHandler(event, 'done')" ondragover="dragOver(event)" ondragleave="dragLeave(event)">
        <div class="kanban-header">✅ Done <span id="countDone">0</span></div>
        <div class="kanban-body" id="colDone"></div>
      </div>
    </div>
  </div>

  <!-- Add Modal -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <h2>➕ Tambah Tugas Baru</h2>
      <div class="form-grid">
        <input type="text" id="newTitle" class="full" placeholder="Judul tugas..." required>
        <select id="newStatus">
          <option value="todo">To Do</option>
          <option value="progress">In Progress</option>
          <option value="done">Done</option>
        </select>
        <input type="text" id="newAssignee" placeholder="Assignee (username GitHub)">
        <input type="date" id="newDue">
        <textarea id="newBody" class="full" placeholder="Deskripsi (opsional)" rows="3"></textarea>
      </div>
      <p id="addError" class="error"></p>
      <div style="display:flex; gap:0.5rem; justify-content: flex-end;">
        <button class="secondary" onclick="closeModal('add')">Batal</button>
        <button onclick="createTask()">Simpan ke GitHub</button>
      </div>
    </div>
  </div>

  <!-- Setup Modal -->
  <div class="modal-overlay open" id="setupModal">
    <div class="modal">
      <h2>⚙️ Konfigurasi GitHub</h2>
      <div class="form-grid">
        <input type="text" id="ghOwner" placeholder="Username/Org">
        <input type="text" id="ghRepo" placeholder="Nama Repository">
        <input type="password" id="ghToken" class="full" placeholder="Personal Access Token (scope: repo)">
      </div>
      <p style="color:var(--muted); font-size:0.8rem; margin-bottom:1rem;">
        🔑 Buat PAT di GitHub → Settings → Developer Settings → Personal Access Tokens → Classic → Centang <code>repo</code>
      </p>
      <p id="setupError" class="error"></p>
      <button class="full" onclick="connectGitHub()">🔌 Hubungkan</button>
    </div>
  </div>

  <script>
    // State & Config
    const API = 'https://api.github.com/repos';
    let config = {};
    let tasks = [];
    let currentView = 'list';
    let draggedTaskId = null;

    // Init
    document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('gh_tracker_v2_config');
      if (saved) {
        try { Object.assign(config, JSON.parse(saved)); } catch {}
        if (config.owner && config.repo && config.token) {
          document.getElementById('setupModal').classList.remove('open');
          loadTasks();
        }
      }
      document.getElementById('searchInput').addEventListener('input', debounce(applyFilters, 300));
    });

    // API Wrapper
    async function ghFetch(path, method = 'GET', body = null) {
      const res = await fetch(`${API}/${config.owner}/${config.repo}${path}`, {
        method, headers: { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : null
      });
      if (!res.ok) { const e = await res.json(); throw new Error(e.message || `Error ${res.status}`); }
      return res.json();
    }

    // Connect
    async function connectGitHub() {
      const o = document.getElementById('ghOwner').value.trim();
      const r = document.getElementById('ghRepo').value.trim();
      const t = document.getElementById('ghToken').value.trim();
      const err = document.getElementById('setupError');
      if (!o || !r || !t) return showErr(err, 'Semua field wajib diisi.');
      
      try {
        await ghFetch(''); // Test connection
        config = { owner: o, repo: r, token: t };
        localStorage.setItem('gh_tracker_v2_config', JSON.stringify(config));
        document.getElementById('setupModal').classList.remove('open');
        loadTasks();
      } catch (e) { showErr(err, e.message); }
    }

    // Load Tasks
    async function loadTasks() {
      const listEl = document.getElementById('listView');
      listEl.innerHTML = '<div class="loading">Memuat data dari GitHub...</div>';
      try {
        const issues = await ghFetch('/issues?state=all&per_page=100');
        tasks = issues.filter(i => !i.pull_request).map(parseIssue);
        applyFilters();
        updateProgress();
      } catch (e) {
        listEl.innerHTML = `<div class="error" style="display:block">Gagal memuat: ${e.message}</div>`;
      }
    }

    // Parse GitHub Issue -> Task Object
    function parseIssue(issue) {
      const meta = issue.body?.match(/<!-- TRACKER_META:({.*?}) -->/s)?.[1];
      let due = null, assignee = '';
      if (meta) { try { ({ due, assignee } = JSON.parse(meta)); } catch {} }
      assignee = assignee || (issue.assignees[0]?.login || '');
      
      let status = 'todo';
      const hasLabel = n => issue.labels.some(l => l.name.toLowerCase() === n);
      if (issue.state === 'closed' || hasLabel('done')) status = 'done';
      else if (hasLabel('in progress') || hasLabel('progress')) status = 'progress';

      return { id: issue.number, title: issue.title, status, due, assignee, body: issue.body, html_url: issue.html_url, created: issue.created_at };
    }

    // Render & Filter
    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const statusFilter = document.getElementById('filterStatus').value;
      const assigneeFilter = document.getElementById('filterAssignee').value.toLowerCase();

      const filtered = tasks.filter(t => {
        const matchSearch = t.title.toLowerCase().includes(search);
        const matchStatus = statusFilter === 'all' || t.status === statusFilter;
        const matchAssignee = !assigneeFilter || (t.assignee?.toLowerCase().includes(assigneeFilter));
        return matchSearch && matchStatus && matchAssignee;
      });

      renderList(filtered);
      renderBoard(filtered);
    }

    function renderList(data) {
      const el = document.getElementById('listView');
      if (!data.length) { el.innerHTML = '<div class="empty">Tidak ada tugas yang cocok.</div>'; return; }
      el.innerHTML = data.map(t => taskHTML(t, true)).join('');
    }

    function renderBoard(data) {
      const cols = { todo: [], progress: [], done: [] };
      data.forEach(t => cols[t.status]?.push(t));
      ['Todo', 'Progress', 'Done'].forEach(k => document.getElementById(`col${k}`).innerHTML = cols[k.toLowerCase()].map(t => taskHTML(t, false)).join(''));
      document.getElementById('countTodo').textContent = cols.todo.length;
      document.getElementById('countProgress').textContent = cols.progress.length;
      document.getElementById('countDone').textContent = cols.done.length;
    }

    function taskHTML(t, isList) {
      const badge = t.status === 'todo' ? 'todo' : t.status === 'progress' ? 'progress' : 'done';
      const statusText = t.status === 'todo' ? 'To Do' : t.status === 'progress' ? 'In Progress' : 'Done';
      const next = t.status === 'done' ? 'todo' : 'done';
      const btnText = t.status === 'done' ? '🔄 Buka' : '✅ Selesai';
      const dueBadge = t.due ? `<span class="badge due">📅 ${t.due}</span>` : '';
      const assignBadge = t.assignee ? `<span class="badge" style="background:#1e1b4b;color:#a5b4fc">👤 ${t.assignee}</span>` : '';
      
      if (isList) {
        return `<div class="task-card">
          <div class="task-meta">
            <div class="task-title">${t.title}</div>
            <div class="task-badges">
              <span class="badge ${badge}">${statusText}</span>
              ${dueBadge} ${assignBadge}
            </div>
          </div>
          <div class="task-actions">
            <button class="secondary" onclick="window.open('${t.html_url}')">💬</button>
            <button onclick="toggleStatus(${t.id}, '${next}')">${btnText}</button>
          </div>
        </div>`;
      }
      return `<div class="kanban-card" draggable="true" ondragstart="dragStart(event, ${t.id})">
        <h4>${t.title}</h4>
        <div class="sub">${dueBadge} ${assignBadge}</div>
      </div>`;
    }

    // Progress
    function updateProgress() {
      const total = tasks.length;
      const done = tasks.filter(t => t.status === 'done').length;
      const pct = total ? Math.round((done/total)*100) : 0;
      document.getElementById('progBar').style.width = `${pct}%`;
      document.getElementById('progPercent').textContent = `${pct}%`;
      document.getElementById('progLabel').textContent = `${done} / ${total} tugas selesai`;
    }

    // CRUD
    async function createTask() {
      const title = document.getElementById('newTitle').value.trim();
      const status = document.getElementById('newStatus').value;
      const assignee = document.getElementById('newAssignee').value.trim();
      const due = document.getElementById('newDue').value;
      const body = document.getElementById('newBody').value.trim();
      const err = document.getElementById('addError');
      
      if (!title) return showErr(err, 'Judul wajib diisi.');
      
      const labels = status === 'progress' ? ['In Progress'] : status === 'done' ? ['Done'] : ['To Do'];
      const meta = `<!-- TRACKER_META:${JSON.stringify({due, assignee})} -->`;
      const fullBody = body + (body ? '\n\n' : '') + meta;
      const payload = { title, body: fullBody, labels, assignees: assignee ? [assignee] : [] };
      if (status === 'done') payload.state = 'closed';

      try {
        await ghFetch('/issues', 'POST', payload);
        closeModal('add');
        loadTasks();
        document.getElementById('newTitle').value = '';
        document.getElementById('newBody').value = '';
        document.getElementById('newAssignee').value = '';
        document.getElementById('newDue').value = '';
      } catch (e) { showErr(err, e.message); }
    }

    async function toggleStatus(id, next) {
      const labels = next === 'done' ? ['Done'] : ['To Do'];
      const state = next === 'done' ? 'closed' : 'open';
      try {
        await ghFetch(`/issues/${id}`, 'PATCH', { state, labels });
        loadTasks();
      } catch (e) { alert('Gagal update: ' + e.message); }
    }

    // Drag & Drop
    function dragStart(e, id) { draggedTaskId = id; e.dataTransfer.effectAllowed = 'move'; }
    function dragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
    function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
    async function dropHandler(e, status) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      if (!draggedTaskId) return;
      await toggleStatus(draggedTaskId, status === 'done' ? 'done' : status === 'progress' ? 'progress' : 'todo');
      draggedTaskId = null;
    }

    // View & Modal
    function switchView(v) {
      currentView = v;
      document.getElementById('listView').classList.toggle('hidden', v !== 'list');
      document.getElementById('boardView').classList.toggle('hidden', v !== 'board');
      document.getElementById('viewList').classList.toggle('active', v === 'list');
      document.getElementById('viewBoard').classList.toggle('active', v === 'board');
    }
    function openModal(id) { document.getElementById(id+'Modal').classList.add('open'); }
    function closeModal(id) { document.getElementById(id+'Modal').classList.remove('open'); }
    function showErr(el, msg) { el.textContent = msg; el.style.display = 'block'; setTimeout(() => el.style.display='none', 4000); }
    function debounce(fn, ms) { let t; return (...a) => clearTimeout(t), t = setTimeout(() => fn(...a), ms); }

    // Export CSV
    function exportCSV() {
      if (!tasks.length) return alert('Tidak ada data untuk diexport.');
      let csv = '\uFEFFTitle,Status,Assignee,Due Date,URL,Created\n';
      tasks.forEach(t => {
        csv += `"${t.title}","${t.status}","${t.assignee}","${t.due||''}","${t.html_url}","${new Date(t.created).toLocaleDateString('id-ID')}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `github-tracker-${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }
  </script>
</body>
</html>
